name: 600547追踪卡（每日自动）

on:
  workflow_dispatch:
  schedule:
    - cron: '45 13 * * *'   # 排在兑现率HTML(13:30)后面, 错峰

permissions:
  contents: write

concurrency:
  group: track-600547-push
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 渲染追踪卡
        run: |
          python3 scripts/track_600547_html.py

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "docs: 600547追踪卡 $(date -u +%Y%m%d)"
            git pull --rebase origin main
            git push
          fi
