name: 每日拉限售解禁

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉限售解禁
        run: |
          python3 << 'PYEOF'
          import akshare as ak
          import json, os
          from datetime import datetime, timezone, timedelta

          os.makedirs('data/restricted', exist_ok=True)
          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y%m%d')

          result = {
              'date': today,
              'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'),
              'data': []
          }

          try:
              df = ak.stock_restricted_release_queue_em()
              if df is not None and len(df) > 0:
                  result['data'] = df.head(200).to_dict('records')
                  print(f'OK: {len(df)} 条')
              else:
                  print('⚠️  空')
          except Exception as e:
              print(f'FAIL: {type(e).__name__} {e}')

          with open(f'data/restricted/{today}.json', 'w') as f:
              json.dump(result, f, ensure_ascii=False, default=str)
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/restricted/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data: 限售解禁 $(date -u +%Y%m%d)"
            git push
          fi
