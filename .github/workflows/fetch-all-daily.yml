name: 全市场日线拉取

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉全市场日线
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 << 'PYEOF'
          import akshare as ak
          import requests, json, os, time, subprocess

          print('=== 第 1 步：akshare 拉全市场股票清单 ===')
          df = ak.stock_zh_a_spot_em()
          print(f'akshare 返回 {len(df)} 只')

          codes = []
          for _, r in df.iterrows():
              code = str(r['代码'])
              name = str(r['名称'])
              if code.startswith('6'):
                  tx = 'sh' + code
              elif code.startswith(('0', '3')):
                  tx = 'sz' + code
              else:
                  continue
              codes.append({'tx': tx, 'name': name})

          print(f'过滤后 {len(codes)} 只（已剔除北交所）')

          os.makedirs('data/kline', exist_ok=True)
          with open('data/kline/_stock_list.json', 'w') as f:
              json.dump({'count': len(codes), 'stocks': codes}, f, ensure_ascii=False)

          subprocess.run(['git', 'add', 'data/kline/_stock_list.json'])
          subprocess.run(['git', 'commit', '-m', f'data: 全市场清单 {len(codes)} 只'])
          subprocess.run(['git', 'push'])

          print('=== 第 2 步：分批拉日线 ===')
          BATCH = 500
          total = (len(codes) + BATCH - 1) // BATCH
          ok, fail, skip = 0, 0, 0

          for i in range(total):
              batch = codes[i*BATCH:(i+1)*BATCH]
              print(f'\n--- 批次 {i+1}/{total} ({len(batch)} 只) ---')
              for s in batch:
                  tx = s['tx']
                  sub = tx[:2]
                  os.makedirs(f'data/kline/{sub}', exist_ok=True)
                  fp = f'data/kline/{sub}/{tx}.json'
                  if os.path.exists(fp):
                      skip += 1
                      continue
                  try:
                      url = "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
                      params = {'param': f'{tx},day,,,500,qfq'}
                      r = requests.get(url, params=params, timeout=15)
                      d = r.json()
                      klines = d['data'][tx].get('qfqday', [])
                      with open(fp, 'w') as f:
                          json.dump({
                              'code': tx,
                              'name': s['name'],
                              'updated': time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime()),
                              'count': len(klines),
                              'klines': klines
                          }, f, ensure_ascii=False)
                      ok += 1
                  except Exception as e:
                      fail += 1
                  time.sleep(0.15)
              print(f'批次 {i+1} 完成：累计 ok={ok} skip={skip} fail={fail}')

              subprocess.run(['git', 'add', 'data/kline/'])
              subprocess.run(['git', 'commit', '-m', f'data: 全市场日线 批次{i+1}'])
              subprocess.run(['git', 'push'])

          print(f'\n=== 全部完成：{ok} 新拉, {skip} 跳过, {fail} 失败 ===')
          PYEOF
