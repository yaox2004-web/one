name: 全市场日线拉取

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 拉全市场日线
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python3 << 'PYEOF'
          import requests, json, os, time, subprocess

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0',
          }

          print('=== 第 1 步：拉全市场股票清单 ===')
          url = "http://80.push2.eastmoney.com/api/qt/clist/get"
          params = {
              'pn': '1', 'pz': '6000', 'po': '1', 'np': '1',
              'fltt': '2', 'invt': '2', 'fid': 'f3',
              'fs': 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048',
              'fields': 'f12,f14',
          }
          r = requests.get(url, params=params, headers=HEADERS, timeout=30)
          data = r.json()
          stocks = data['data']['diff']
          print(f'共 {len(stocks)} 只')

          codes = []
          for s in stocks:
              code = s['f12']
              name = s['f14']
              if code.startswith('6'):
                  tx = 'sh' + code
              elif code.startswith(('0', '3')):
                  tx = 'sz' + code
              else:
                  continue
              codes.append({'tx': tx, 'name': name})

          print(f'过滤后 {len(codes)} 只（已剔除北交所）')

          os.makedirs('data/kline', exist_ok=True)
          with open('data/kline/_stock_list.json', 'w') as f:
              json.dump({'count': len(codes), 'stocks': codes}, f, ensure_ascii=False)

          subprocess.run(['git', 'add', 'data/kline/_stock_list.json'])
          subprocess.run(['git', 'commit', '-m', 'data: 全市场股票清单'])
          subprocess.run(['git', 'push'])

          print('=== 第 2 步：分批拉日线 ===')
          BATCH = 500
          total = (len(codes) + BATCH - 1) // BATCH
          ok, fail = 0, 0

          for i in range(total):
              batch = codes[i*BATCH:(i+1)*BATCH]
              print(f'\n--- 批次 {i+1}/{total} ({len(batch)} 只) ---')
              for s in batch:
                  tx = s['tx']
                  sub = tx[:2]
                  os.makedirs(f'data/kline/{sub}', exist_ok=True)
                  fp = f'data/kline/{sub}/{tx}.json'
                  if os.path.exists(fp):
                      continue
                  try:
                      url = "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
                      params = {'param': f'{tx},day,,,500,qfq'}
                      r = requests.get(url, params=params, timeout=15)
                      d = r.json()
                      klines = d['data'][tx].get('qfqday', [])
                      with open(fp, 'w') as f:
                          json.dump({
                              'code': tx,
                              'name': s['name'],
                              'updated': time.strftime('%Y-%m-%d %H:%M:%S UTC', time.gmtime()),
                              'count': len(klines),
                              'klines': klines
                          }, f, ensure_ascii=False)
                      ok += 1
                  except Exception as e:
                      fail += 1
                  time.sleep(0.2)
              print(f'批次 {i+1} 完成：累计 ok={ok} fail={fail}')

              subprocess.run(['git', 'add', 'data/kline/'])
              subprocess.run(['git', 'commit', '-m', f'data: 全市场日线 批次{i+1}'])
              subprocess.run(['git', 'push'])

          print(f'\n=== 全部完成：{ok} 成功, {fail} 失败 ===')
          PYEOF
