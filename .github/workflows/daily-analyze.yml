name: 每日跑阶段分析

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 Python 依赖
        run: pip install pandas numpy requests tenacity -q

      - name: 跑阶段分析
        run: |
          cd scripts
          python3 phases.py
          echo "=== 分析输出 ==="
          ls -la ../data/analysis/ || echo "无分析目录"

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data: 阶段分析 $(date -u +%Y%m%d)"
            git push
          fi
