name: 每日拉1分钟数据

on:
  workflow_dispatch:
  schedule:
    - cron: '10 12 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 拉1分钟数据
        run: |
          python3 << 'PYEOF'
          import requests, json, os, time
          from datetime import datetime, timezone

          codes = [
              ('sh601138', '工业富联'),
              ('sz300476', '胜宏科技'),
              ('sh603516', '淳中科技'),
              ('sz002156', '通富微电'),
              ('sh603283', '赛腾股份'),
              ('sh601231', '环旭电子'),
              ('sz300394', '天孚通信'),
              ('sh600584', '长电科技'),
              ('sh000001', '上证指数'),
          ]

          os.makedirs('data/kline_1min', exist_ok=True)
          ok, fail = 0, 0

          for code, name in codes:
              url = f"https://ifzq.gtimg.cn/appstock/app/kline/mkline"
              params = {
                  'param': f'{code},m1,,640'
              }
              try:
                  r = requests.get(url, params=params, timeout=30)
                  data = r.json()
                  klines = data.get('data', {}).get(code, {}).get('m1', [])
                  out = {
                      'code': code,
                      'name': name,
                      'updated': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'),
                      'count': len(klines),
                      'klines': klines
                  }
                  with open(f'data/kline_1min/{code}.json', 'w') as f:
                      json.dump(out, f, ensure_ascii=False)
                  print(f'OK {code} {name}: {len(klines)} 条')
                  ok += 1
              except Exception as e:
                  print(f'FAIL {code} {name}: {type(e).__name__} {e}')
                  fail += 1
              time.sleep(2)

          print(f'\n总计: {ok} 成功, {fail} 失败')
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kline_1min/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 1min更新 $(date -u +%Y%m%d)"
            git push
          fi
