name: 测试云端拉数据

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 测试腾讯日线接口
        run: |
          curl -s -m 20 "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=sh601138,day,,,5,qfq" | head -c 300
          echo ""
          echo "---"
      - name: 测试新浪5分钟接口
        run: |
          curl -s -m 20 "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketDataService.getKLineData?symbol=sh601138&scale=5&ma=no&datalen=5" | head -c 300
          echo ""
          echo "---"
      - name: 测试东财接口
        run: |
          curl -s -m 20 "https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_LICO_FN_CPD&pageSize=1" | head -c 300
