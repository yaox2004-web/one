name:抄底新规则验证

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装依赖
        run: pip install pandas numpy -q

      - name: 跑抄底新规则
        run: |
          cd scripts
          python3 bottom_ranking.py

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data: 抄底新规则验证 $(date -u +%Y%m%d)"
            git push
          fi
