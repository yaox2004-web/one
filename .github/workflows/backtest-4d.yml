name: 四维看盘法回测

on:
  workflow_dispatch:
  schedule:
    - cron: '40 12 * * 0'

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖（锁定版本）
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 一键修补回测脚本
        run: |
          cd scripts
          python3 fix_backtest.py
          python3 fix_backtest2.py

      - name: 跑回测脚本
        run: |
          cd scripts
          python3 backtest_4d.py

      - name: 提交胜率JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "胜率文件无变化"
          else
            git commit -m "data: 回测胜率+修补后脚本 $(date -u +%Y%m%d)"
            git pull --rebase origin main
            git push
          fi
