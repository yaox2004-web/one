name: 四维看盘法回测

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'  # 每周日下午6点自动跑一次

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pandas numpy
      
      - name: 跑回测脚本
        run: |
          cd scripts
          python3 backtest_4d.py
      
      - name: 提交胜率JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analysis/winrate.json
          if git diff --cached --quiet; then
            echo "胜率文件无变化"
          else
            git commit -m "data: 回测胜率更新 $(date -u +%Y%m%d)"
            git push
          fi
