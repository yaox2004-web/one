name: 每日拉融资融券

on:
  workflow_dispatch:
  schedule:
    - cron: '25 12 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉融资融券
        run: |
          python3 << 'PYEOF'
          import akshare as ak
          import json, os
          from datetime import datetime, timezone, timedelta

          os.makedirs('data/margin', exist_ok=True)
          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y%m%d')

          result = {
              'date': today,
              'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'),
              'data': {}
          }

          try:
              df = ak.stock_margin_detail_sse(date=today)
              result['data']['sse'] = df.to_dict('records')
              print(f'OK 沪市: {len(df)} 条')
          except Exception as e:
              print(f'FAIL 沪市: {type(e).__name__} {e}')
              result['data']['sse'] = []

          try:
              df = ak.stock_margin_detail_szse(date=today)
              result['data']['szse'] = df.to_dict('records')
              print(f'OK 深市: {len(df)} 条')
          except Exception as e:
              print(f'FAIL 深市: {type(e).__name__} {e}')
              result['data']['szse'] = []

          with open(f'data/margin/{today}.json', 'w') as f:
              json.dump(result, f, ensure_ascii=False, default=str)
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/margin/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 融资融券 $(date -u +%Y%m%d)"
            git push
          fi
