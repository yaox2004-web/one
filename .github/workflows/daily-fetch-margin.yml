name: 每日拉融资融券

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉融资融券
        run: |
          python3 << 'PYEOF'
          import akshare as ak
          import json, os, time
          from datetime import datetime, timezone, timedelta

          os.makedirs('data/margin', exist_ok=True)
          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y%m%d')

          result = {
              'date': today,
              'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'),
              'data': {'sse': [], 'szse': []}
          }

          # 探测：沪深数据都没出直接退出
          probe_ok = 0
          for probe_fn in [ak.stock_margin_detail_sse, ak.stock_margin_detail_szse]:
              try:
                  probe_df = probe_fn(date=today)
                  if probe_df is not None and len(probe_df) > 0:
                      probe_ok += 1
              except Exception:
                  pass
          if probe_ok == 0:
              print(f'沪深融资融券数据均未生成（{today}），跳过')
              import sys
              sys.exit(0)

          for market, fn in [('sse', ak.stock_margin_detail_sse),
                              ('szse', ak.stock_margin_detail_szse)]:
              success = False
              for attempt in range(3):
                  try:
                      df = fn(date=today)
                  except ValueError as e:
                      print(f'⚠️  {market}: 今天数据未生成（{today}），接口返回空')
                      success = True
                      break
                  except Exception as e:
                      wait = 5 * (attempt + 1)
                      print(f'  重试 {attempt+1}/3 {market}: {type(e).__name__}，等 {wait}s')
                      time.sleep(wait)
                      continue
                  if df is None or len(df) == 0:
                      print(f'⚠️  {market}: 今天数据未生成（{today}）')
                      success = True
                      break
                  result['data'][market] = df.to_dict('records')
                  print(f'OK {market}: {len(df)} 条')
                  success = True
                  break
              if not success:
                  print(f'FAIL {market}: 3 次重试均失败')

          with open(f'data/margin/{today}.json', 'w') as f:
              json.dump(result, f, ensure_ascii=False, default=str)
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/margin/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 融资融券 $(date -u +%Y%m%d)"
            git push
          fi
