name: 测试推送

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 写测试文件 + 推送
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > last-run.txt
          git add last-run.txt
          git commit -m "chore: 云端测试提交"
          git push
