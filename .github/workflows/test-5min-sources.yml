name: 测试5min替代源

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 腾讯mkline(5min)
        run: |
          curl -s -m 20 "https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=sh601138,m5,,10" | head -c 300
          echo ""
          echo "---"
      - name: 东财push2his(5min)
        run: |
          curl -s -m 20 "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.601138&fields1=f1,f2,f3,f4,f5&fields2=f51,f52,f53,f54,f55,f56&klt=5&fqt=1&end=20500101&lmt=10" | head -c 300
          echo ""
          echo "---"
      - name: 东财push2(5min备用)
        run: |
          curl -s -m 20 "https://push2.eastmoney.com/api/qt/stock/trends2/get?secid=1.601138&fields1=f1,f2,f3,f4,f5&fields2=f51,f52,f53,f54,f55&iscr=0&ndays=1" | head -c 300
