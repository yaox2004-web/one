name: 死信号对照 + SOS解剖（手动）

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diag-push
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 跑两个诊断脚本
        run: |
          python3 scripts/death_signal_payoff.py
          python3 scripts/diag_sos13.py

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "diag: 死信号对照组+SOS13解剖 $(date -u +%Y%m%d)"
            git pull --rebase origin main
            git push
          fi
