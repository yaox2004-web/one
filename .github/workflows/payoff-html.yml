name: 兑现率HTML报告（每日自动）

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'   # 主流程12:00 UTC开跑约25分钟, 13:30来渲染, 错峰不撞车

permissions:
  contents: write

concurrency:
  group: payoff-html-push
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 渲染兑现率HTML
        run: |
          python3 scripts/payoff_report_html.py

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "docs: 兑现率HTML报告 $(date -u +%Y%m%d)"
            git pull --rebase origin main
            git push
          fi
