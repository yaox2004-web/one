name: 每日拉北向资金

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉北向个股持仓
        run: |
          python3 << 'PYEOF'
          import akshare as ak
          import json, os
          from datetime import datetime, timezone, timedelta

          os.makedirs('data/north', exist_ok=True)

          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y-%m-%d')

          try:
              df = ak.stock_hsgt_individual_em(stock="北向资金")
              if df is None or len(df) == 0:
                  print(f'无北向数据（{today}）')
                  exit(0)

              rows = df.to_dict('records')
              out = {
                  'date': today,
                  'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'),
                  'count': len(rows),
                  'rows': rows
              }
              with open(f'data/north/{today}.json', 'w') as f:
                  json.dump(out, f, ensure_ascii=False, default=str)
              print(f'OK {today}: {len(rows)} 条记录')

          except Exception as e:
              print(f'FAIL: {type(e).__name__} {e}')
              raise
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/north/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "data: 北向持仓 $(date -u +%Y%m%d)"
            git push
          fi
