name: 每日拉市场数据

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 装 akshare
        run: pip install akshare -q

      - name: 拉龙虎榜
        run: |
          python3 << 'PYEOF'
          import requests, json, os
          from datetime import datetime, timezone, timedelta

          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0',
              'Referer': 'https://data.eastmoney.com/stock/tradedetail.html',
              'Accept': 'application/json, text/plain, */*',
          }

          os.makedirs('data/lhb', exist_ok=True)
          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y-%m-%d')

          url = "https://datacenter-web.eastmoney.com/api/data/v1/get"
          params = {
              'reportName': 'RPT_DAILYBILLBOARD_DETAILSNEW',
              'columns': 'ALL',
              'filter': f"(TRADE_DATE='{today}')",
              'pageNumber': '1', 'pageSize': '500',
              'sortTypes': '-1', 'sortColumns': 'SECURITY_CODE',
              'source': 'WEB', 'client': 'WEB',
          }

          try:
              r = requests.get(url, params=params, headers=HEADERS, timeout=30)
              data = r.json()
              result = data.get('result')
              if not result:
                  print(f'无龙虎榜数据（{today}）')
              else:
                  rows = result.get('data', [])
                  out = {'date': today, 'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'), 'count': len(rows), 'rows': rows}
                  with open(f'data/lhb/{today}.json', 'w') as f:
                      json.dump(out, f, ensure_ascii=False)
                  print(f'龙虎榜完成: {len(rows)}条')
          except Exception as e:
              print(f'龙虎榜失败: {e}')
          PYEOF

      - name: 拉限售解禁
        run: |
          python3 << 'PYEOF'
          import akshare as ak
          import json, os
          from datetime import datetime, timezone, timedelta

          os.makedirs('data/restricted', exist_ok=True)
          bj_now = datetime.now(timezone.utc) + timedelta(hours=8)
          today = bj_now.strftime('%Y-%m-%d')

          result = {'date': today, 'updated': bj_now.strftime('%Y-%m-%d %H:%M:%S BJT'), 'data': []}

          try:
              df = ak.stock_restricted_release_queue_em()
              if df is not None and len(df) > 0:
                  result['data'] = df.head(200).to_dict('records')
                  print(f'限售解禁完成: {len(df)}条')
              else:
                  print('限售解禁: 空')
          except Exception as e:
              print(f'限售解禁失败: {e}')

          with open(f'data/restricted/{today}.json', 'w') as f:
              json.dump(result, f, ensure_ascii=False, default=str)
          PYEOF

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lhb/ data/restricted/
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data: 市场数据 $(date -u +%Y%m%d)"
            git push
          fi
