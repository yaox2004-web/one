name: 每日拉行情数据（全市场版）

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: data-push
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: 全市场日线 + 1分钟 + 记账（一体化）
        run: |
          python3 << 'PYEOF'
          import requests, json, os, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          # ============================================================
          # 配置
          # ============================================================
          MAX_WORKERS = 5

          HOLDINGS_1MIN = [
              'sh601138', 'sz300476', 'sh603516', 'sz002156',
              'sh603283', 'sh601231', 'sz300394', 'sh600584',
              'sh000001',
          ]

          # ============================================================
          # 1. 获取股票列表（本地优先）
          # ============================================================
          print("=" * 60)
          print("[1/4] 获取股票列表...")
          print("=" * 60)

          all_stocks = []

          # ===== 优先：从本地 data/kline/ 目录读取 =====
          for market in ['sh', 'sz', 'bj']:
              dir_path = f'data/kline/{market}'
              if os.path.exists(dir_path):
                  for fname in sorted(os.listdir(dir_path)):
                      if not fname.endswith('.json'):
                          continue
                      code = fname[:-5]
                      try:
                          with open(f'{dir_path}/{fname}', 'r', encoding='utf-8') as f:
                              data = json.load(f)
                              name = data.get('name', code)
                      except Exception:
                          name = code
                      all_stocks.append((code, name))

          if all_stocks:
              print(f"  [本地] 从 data/kline/ 读取到 {len(all_stocks)} 只股票")
          else:
              # ===== 兜底：本地为空时，只用持仓股 =====
              print(f"  [兜底] 本地为空，只拉持仓股")
              all_stocks = [
                  ('sh600584', '长电科技'), ('sz002156', '通富微电'),
                  ('sh603283', '赛腾股份'), ('sz300394', '天孚通信'),
                  ('sh601138', '工业富联'), ('sh601231', '环旭电子'),
                  ('sz300476', '胜宏科技'), ('sh603516', '淳中科技'),
              ]

          # 加指数
          if not any(c == 'sh000001' for c, _ in all_stocks):
              all_stocks.append(('sh000001', '上证指数'))

          if not all_stocks:
              print("  股票列表为空，退出")
              exit(1)

          # ============================================================
          # 2. 并发拉取日线
          # ============================================================
          print("\n" + "=" * 60)
          print(f"[2/4] 并发拉取日线（{MAX_WORKERS}线程，{len(all_stocks)}只）...")
          print("=" * 60)

          os.makedirs('data/kline/sh', exist_ok=True)
          os.makedirs('data/kline/sz', exist_ok=True)
          os.makedirs('data/kline/bj', exist_ok=True)

          def fetch_daily(stock_code, stock_name):
              for attempt in range(2):
                  try:
                      url = f'https://quotes.sina.cn/cn/api/jsonp_v2.php/var=/CN_MarketDataService.getKLineData?symbol={stock_code}&scale=240&ma=no&datalen=1023'
                      r = requests.get(url, timeout=15, headers={'User-Agent': 'Mozilla/5.0'})
                      text = r.text
                      start = text.find('([') + 1
                      end = text.rfind('])') + 1
                      if start < 1 or end < 2:
                          continue
                      data = json.loads(text[start:end])
                      if not data:
                          continue
                      klines = [[k['day'], k['open'], k['close'], k['high'], k['low'], k['volume']] for k in data]
                      out = {'name': stock_name, 'klines': klines}
                      sub = stock_code[:2]
                      with open(f'data/kline/{sub}/{stock_code}.json', 'w', encoding='utf-8') as f:
                          json.dump(out, f, ensure_ascii=False)
                      return True
                  except Exception:
                      if attempt < 1:
                          time.sleep(1)
              return False

          daily_ok, daily_fail = 0, 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = {executor.submit(fetch_daily, code, name): (code, name) for code, name in all_stocks}
              for i, future in enumerate(as_completed(futures)):
                  if future.result():
                      daily_ok += 1
                  else:
                      daily_fail += 1
                  if (i + 1) % 500 == 0:
                      print(f"  日线进度: {i+1}/{len(all_stocks)} (成功{daily_ok} 失败{daily_fail})")

          print(f"  日线完成: 成功{daily_ok} 失败{daily_fail}")

          # ============================================================
          # 3. 并发拉取1分钟数据
          # ============================================================
          print("\n" + "=" * 60)
          print(f"[3/4] 并发拉取1分钟数据（{len(HOLDINGS_1MIN)}只）...")
          print("=" * 60)

          os.makedirs('data/kline_1min', exist_ok=True)

          def fetch_1min(stock_code):
              for attempt in range(2):
                  try:
                      url = "https://ifzq.gtimg.cn/appstock/app/kline/mkline"
                      params = {'param': f'{stock_code},m1,,640'}
                      r = requests.get(url, params=params, timeout=30)
                      data = r.json()
                      klines = data.get('data', {}).get(stock_code, {}).get('m1', [])
                      out = {
                          'code': stock_code,
                          'updated': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'),
                          'count': len(klines),
                          'klines': klines
                      }
                      with open(f'data/kline_1min/{stock_code}.json', 'w') as f:
                          json.dump(out, f, ensure_ascii=False)
                      return True
                  except Exception:
                      if attempt < 1:
                          time.sleep(2)
              return False

          min_ok, min_fail = 0, 0
          with ThreadPoolExecutor(max_workers=MAX_WORKERS) as executor:
              futures = {executor.submit(fetch_1min, code): code for code in HOLDINGS_1MIN}
              for future in as_completed(futures):
                  if future.result():
                      min_ok += 1
                  else:
                      min_fail += 1

          print(f"  1分钟完成: 成功{min_ok} 失败{min_fail}")
          PYEOF

      - name: 执行账本记录 + 清理
        run: |
          cd scripts
          python3 record_truth.py
          cd ..

      - name: 提交 + 推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kline/ data/kline_1min/ data/analysis/truth_ledger/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data: 全市场行情+账本 $(date -u +%Y%m%d)"
            git pull --rebase origin main
            git push
          fi
